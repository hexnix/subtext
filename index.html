<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0E10">
<meta name="description" content="Vocabulary decks from the films and shows you watch.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Subtext</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#0E0E10; --surface:#161618; --raised:#202023; --line:#2A2A2F;
  --text:#EDEAE4; --muted:#8E8B93; --faint:#5C5A62;
  --gold:#D9B36C; --gold-soft:rgba(217,179,108,.14); --danger:#E27A64;
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font:15px/1.45 var(--sans);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
svg{display:block}
.num{font-variant-numeric:tabular-nums}

/* ---------- home ---------- */
.home{max-width:820px;margin:0 auto;padding-inline:20px;padding-block:10px 56px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.brand{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:500}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--text);flex:none}
.iconbtn:active{background:var(--raised)}
@media (hover:hover){.iconbtn:hover{background:var(--raised)}}
h1{font-family:var(--serif);font-weight:400;font-size:46px;line-height:1;letter-spacing:-.01em;margin:26px 0 8px;text-wrap:balance}
.summary{color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums;margin:0}
.due{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 14px;margin-top:30px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 18px}}
.tile{position:relative;min-width:0}
.tile-open{display:flex;flex-direction:column;gap:11px;width:100%}
.cover{aspect-ratio:4/3;width:100%;border-radius:12px;overflow:hidden;background:var(--surface);position:relative}
.cover img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .35s}
.cover img.in{opacity:1}
.cover::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);pointer-events:none}
.tile-name{font-family:var(--serif);font-size:22px;line-height:1.08;overflow-wrap:anywhere}
.tile-meta{font-size:12.5px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.tile .more{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  background:rgba(14,14,16,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--text)}
.tile.new .cover{background:transparent;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted)}
.tile.new .cover::after{display:none}
.tile.new .tile-name{color:var(--muted)}
.empty{color:var(--muted);margin-top:24px;max-width:34ch}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .28s;z-index:60}
.scrim.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:560px;margin:0 auto;background:var(--surface);
  border-radius:22px 22px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));
  transform:translateY(100%);transition:transform .34s var(--ease);max-height:90dvh;overflow-y:auto;overscroll-behavior:contain}
.sheet.open{transform:none}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
.sheet h2{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.1;margin:0 0 4px;text-wrap:balance;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:13.5px;margin:0;font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:14px;margin:12px 0 0;max-width:46ch}
.warn{color:var(--gold);font-size:13.5px;margin:10px 0 0}
.list{display:flex;flex-direction:column;margin-top:14px}
.item{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;padding:15px 2px;border-top:1px solid var(--line);min-height:54px}
.item:first-child{border-top:0}
.item .lbl{display:flex;flex-direction:column;gap:2px}
.item .desc{color:var(--muted);font-size:12.5px}
.item .detail{color:var(--muted);font-size:13.5px;display:flex;align-items:center;gap:6px;flex:none}
.item.danger{color:var(--danger)}
.item .tick{color:var(--gold)}
.btns{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btns.col{flex-direction:column}
.btn{flex:1;min-height:50px;border-radius:14px;padding:0 18px;font-weight:500;background:var(--raised);display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--text);color:var(--ink)}
.btn.danger{background:var(--danger);color:#1a0d0a}
.field{margin-top:16px}
.field input{width:100%;height:52px;border-radius:14px;background:var(--ink);border:1px solid var(--line);color:var(--text);
  padding:0 16px;font:inherit;font-size:17px}
.field input:focus{outline:none;border-color:var(--gold)}
.pairs{display:flex;flex-direction:column;gap:10px;max-height:44dvh;overflow-y:auto;margin-top:16px;padding-right:2px}
.pair{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.pair .n{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.pair img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:7px;background:var(--raised);display:block}
.pair img.pdef{object-fit:contain;background:#fff}
.meter{height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:18px}
.meter i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
.peek{display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px}
.peek img{width:100%;border-radius:10px;display:block;background:var(--raised)}

/* ---------- cards page ---------- */
.page{position:fixed;inset:0;z-index:30;background:var(--ink);overflow-y:auto;overscroll-behavior:contain;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  animation:rise .3s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.page .home{padding-bottom:110px}
.page.search .home{padding-top:6px}
.page h1{font-size:36px;margin-top:14px}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:22px}
@media (max-width:360px){.thumbs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:640px){.thumbs{grid-template-columns:repeat(4,minmax(0,1fr))}}
.thumb{position:relative;display:flex;flex-direction:column;gap:5px;min-width:0}
.thumb .pic{aspect-ratio:16/10;border-radius:8px;overflow:hidden;background:var(--surface);position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .w{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gold);display:inline-block;flex:none}
.thumb .dot{position:absolute;top:7px;right:7px;box-shadow:0 0 0 2px rgba(0,0,0,.45)}
.thumb .sel{position:absolute;inset:0;border-radius:8px;box-shadow:inset 0 0 0 2px var(--gold);background:rgba(217,179,108,.18);
  display:none;place-items:center;color:var(--ink)}
.thumb .sel span{width:24px;height:24px;border-radius:50%;background:var(--gold);display:grid;place-items:center}
.thumb.on .sel{display:grid}
.textbtn{color:var(--gold);font-weight:500;padding:10px 6px}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:31;display:flex;align-items:center;gap:10px;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(22,22,24,.94);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.selbar .count{flex:1;color:var(--muted);font-size:14px}
.selbar .btn{flex:none;min-height:44px}

/* ---------- study ---------- */
.study{position:fixed;inset:0;z-index:40;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  animation:fadein .25s ease}
@keyframes fadein{from{opacity:0}}
.study img{-webkit-user-drag:none;-webkit-touch-callout:none;pointer-events:none}
.slide{position:absolute;inset:0;will-change:transform,opacity;transition:transform .32s var(--ease),opacity .32s var(--ease)}
.frame{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.frame img{width:100%;height:100%;object-fit:contain;display:block}
.def{position:absolute;inset:0;background:var(--ink);transform:translateY(100%);transition:transform .34s var(--ease);
  overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none}
.def::-webkit-scrollbar{display:none}
.def .dwrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  padding:calc(env(safe-area-inset-top,0px) + 64px) 0 calc(env(safe-area-inset-bottom,0px) + 28px)}
.def .dimg{width:100%}
.def img{width:100%;height:auto;display:block;border-radius:0}
.def .back{text-align:center;font-size:12.5px;color:var(--faint);padding-inline:16px}
.frame img{transform-origin:50% 50%;will-change:transform}
.chrome{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 22px;background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,0));transition:opacity .25s}
.study.bare .chrome,.study.bare .rail{opacity:0;pointer-events:none}
.pos{display:flex;align-items:center;gap:12px;padding-right:8px;font-size:13px;color:rgba(237,234,228,.82);font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:6px;color:var(--gold);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.rail{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);height:2px;background:rgba(255,255,255,.08);z-index:4;transition:opacity .25s}
.rail i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s var(--ease)}
.hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateX(-50%);z-index:3;
  display:flex;gap:18px;white-space:nowrap;font-size:13px;color:var(--text);padding:11px 18px;border-radius:999px;
  background:rgba(22,22,24,.78);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:opacity .4s}
.hint b{color:var(--gold);font-weight:500}
.hint.gone{opacity:0;pointer-events:none}

/* ---------- search ---------- */
.tools{display:flex;gap:2px;margin-right:-8px}
.searchbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:6px;padding:8px 16px 8px 8px;background:var(--ink)}
.searchbar input{flex:1;min-width:0;height:48px;border-radius:14px;background:var(--surface);border:1px solid var(--line);
  color:var(--text);padding:0 16px;font:inherit;font-size:17px;-webkit-appearance:none;appearance:none}
.searchbar input:focus{outline:none;border-color:var(--gold)}
.results{display:flex;flex-direction:column}
.res{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;align-items:center;width:100%;padding:10px 0;border-top:1px solid var(--line)}
.res:first-child{border-top:0}
.res img{width:76px;aspect-ratio:16/10;object-fit:cover;border-radius:6px;background:var(--surface);display:block}
.res > span{display:flex;flex-direction:column;gap:2px;min-width:0}
.rw{font-family:var(--serif);font-size:23px;line-height:1.1;overflow-wrap:anywhere}
.rw mark{background:none;color:var(--gold)}
.rd{font-size:12.5px;color:var(--muted)}
.wordin{grid-column:2 / 4;height:40px;border-radius:10px;background:var(--ink);border:1px solid var(--line);color:var(--text);
  padding:0 12px;font:inherit;font-size:16px;margin-bottom:6px}
.wordin:focus{outline:none;border-color:var(--gold)}
.sheet h2.muted{color:var(--muted)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);transform:translate(-50%,16px);z-index:80;
  background:var(--text);color:var(--ink);font-size:14px;font-weight:500;padding:11px 18px;border-radius:999px;
  max-width:calc(100% - 32px);opacity:0;transition:opacity .25s,transform .25s var(--ease);pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>

</head>
<body>
<main id="home" class="home" aria-live="polite"></main>
<div id="scrim" class="scrim" hidden></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></div>
<div id="toast" class="toast" role="status"></div>
<input id="picker" type="file" accept="image/*" multiple hidden>
<input id="zipPicker" type="file" accept=".zip,application/zip" multiple hidden>

<script>
(() => {
'use strict';

/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const plural = (n, w, p) => `${n} ${n === 1 ? w : (p || w + 's')}`;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const ls = {
  get(k) { try { return localStorage.getItem('subtext.' + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem('subtext.' + k, v); } catch {} }
};
const svg = (d, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  more: `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>`,
  close: svg('<path d="M6 6l12 12M18 6L6 18"/>'),
  back: svg('<path d="M15 5l-7 7 7 7"/>'),
  plus: svg('<path d="M12 5v14M5 12h14"/>', 26),
  check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 18),
  chev: svg('<path d="M9 6l6 6-6 6"/>', 16),
  search: svg('<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>')
};
const SORTS = { added: 'Order added', newest: 'Newest first', shuffle: 'Shuffle' };

/* ================= storage ================= */
const STORES = ['decks', 'cards', 'blobs', 'meta'];
const KEYS = { decks: 'id', cards: 'id', blobs: 'id', meta: 'k' };
function idbStore(db) {
  const done = t => new Promise((res, rej) => { t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  return {
    all: name => req(db.transaction(name).objectStore(name).getAll()),
    get: (name, key) => req(db.transaction(name).objectStore(name).get(key)),
    put(name, vals) { const t = db.transaction(name, 'readwrite'); const s = t.objectStore(name); vals.forEach(v => s.put(v)); return done(t); },
    del(name, keys) { const t = db.transaction(name, 'readwrite'); const s = t.objectStore(name); keys.forEach(k => s.delete(k)); return done(t); }
  };
}
function memStore() {
  const m = Object.fromEntries(STORES.map(s => [s, new Map()]));
  return {
    all: async n => [...m[n].values()],
    get: async (n, k) => m[n].get(k),
    put: async (n, vals) => vals.forEach(v => m[n].set(v[KEYS[n]], v)),
    del: async (n, keys) => keys.forEach(k => m[n].delete(k))
  };
}
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('subtext', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('decks', { keyPath: 'id' });
      d.createObjectStore('cards', { keyPath: 'id' }).createIndex('deckId', 'deckId');
      d.createObjectStore('blobs', { keyPath: 'id' });
      d.createObjectStore('meta', { keyPath: 'k' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}

let store = memStore();
let decks = [];
let cards = [];

const deckCards = id => cards.filter(c => c.deckId === id).sort((a, b) => a.seq - b.seq);
const dueCount = id => cards.filter(c => c.deckId === id && c.review).length;
const nextSeq = id => cards.reduce((m, c) => c.deckId === id ? Math.max(m, c.seq) : m, 0) + 1;
const saveCards = list => store.put('cards', list).catch(storageFail);
const saveDeck = d => store.put('decks', [d]).catch(storageFail);
function storageFail(e) { console.error(e); toast('Couldn’t save. Your phone may be out of space.'); }

/* image urls */
const urls = new Map();
const thumbIds = new Set();
async function blobURL(id) {
  if (!id) return '';
  if (urls.has(id)) return urls.get(id);
  const rec = await store.get('blobs', id).catch(() => null);
  if (!rec) return '';
  const u = URL.createObjectURL(rec.blob);
  urls.set(id, u);
  return u;
}
function releaseFull() {
  for (const [id, u] of urls) if (!thumbIds.has(id)) { URL.revokeObjectURL(u); urls.delete(id); }
}
async function makeThumb(blob, max = 560) {
  try {
    let src;
    try { src = await createImageBitmap(blob); }
    catch {
      src = new Image(); const u = URL.createObjectURL(blob); src.src = u;
      await src.decode(); URL.revokeObjectURL(u);
    }
    const w = src.width, h = src.height, s = Math.min(1, max / w);
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
    if (src.close) src.close();
    const out = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.8));
    return out || blob;
  } catch { return blob; }
}
function newDeck(name) {
  const d = { id: uid(), name: name.trim(), sort: 'added', createdAt: Date.now() };
  decks.push(d); saveDeck(d);
  return d;
}
async function addPair(deck, frame, def, extra = {}) {
  const thumb = await makeThumb(frame);
  const ids = { frameId: uid(), defId: uid(), thumbId: uid() };
  await store.put('blobs', [{ id: ids.frameId, blob: frame }, { id: ids.defId, blob: def }, { id: ids.thumbId, blob: thumb }]);
  const card = Object.assign({
    id: uid(), deckId: deck.id, seq: nextSeq(deck.id), word: '',
    review: false, streak: 0, peeks: 0, seen: 0, lastSeen: 0, addedAt: Date.now()
  }, extra, ids, { deckId: deck.id });
  if (extra.seq == null) card.seq = nextSeq(deck.id);
  cards.push(card);
  await store.put('cards', [card]);
  thumbIds.add(card.thumbId);
  return card;
}
async function deleteCards(list) {
  const ids = new Set(list.map(c => c.id));
  cards = cards.filter(c => !ids.has(c.id));
  const blobIds = list.flatMap(c => [c.frameId, c.defId, c.thumbId]);
  blobIds.forEach(id => { if (urls.has(id)) { URL.revokeObjectURL(urls.get(id)); urls.delete(id); } thumbIds.delete(id); });
  await store.del('cards', [...ids]).catch(storageFail);
  await store.del('blobs', blobIds).catch(storageFail);
}
function askPersist() { try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {} }

/* ================= navigation (Android back) ================= */
const stack = [];
let histOK = true, afterPop = null;
function pushLayer(onPop) {
  stack.push(onPop);
  try { history.pushState({ subtext: stack.length }, ''); } catch { histOK = false; }
}
function back(then) {
  if (!stack.length) { then && then(); return; }
  if (histOK) { afterPop = then || null; history.back(); }
  else { stack.pop()(); then && then(); }
}
addEventListener('popstate', () => {
  const f = stack.pop(); if (f) f();
  const t = afterPop; afterPop = null; if (t) t();
});

/* ================= toast ================= */
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ================= sheet ================= */
let sheetOpen = false, sheetActions = {}, sheetCleanup = null;
function sheet(html, actions = {}, onMount) {
  const sh = $('#sheet'), sc = $('#scrim');
  if (sheetCleanup) { sheetCleanup(); sheetCleanup = null; }
  sh.innerHTML = '<div class="grab"></div>' + html;
  sheetActions = actions;
  if (!sheetOpen) {
    sheetOpen = true; sh.hidden = false; sc.hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => { sh.classList.add('open'); sc.classList.add('open'); }));
    pushLayer(hideSheet);
  }
  sh.scrollTop = 0;
  if (onMount) onMount(sh);
}
function hideSheet() {
  const sh = $('#sheet'), sc = $('#scrim');
  sheetOpen = false; sh.classList.remove('open'); sc.classList.remove('open');
  if (sheetCleanup) { sheetCleanup(); sheetCleanup = null; }
  setTimeout(() => { if (!sheetOpen) { sh.hidden = true; sc.hidden = true; sh.innerHTML = ''; } }, 340);
}
function closeSheet(then) { if (sheetOpen) back(then); else if (then) then(); }
$('#scrim').addEventListener('click', () => closeSheet());
$('#sheet').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const f = sheetActions[b.dataset.act]; if (f) f(b);
});
$('#sheet').addEventListener('submit', e => {
  e.preventDefault(); const f = sheetActions.submit; if (f) f(e.target);
});
const item = (act, label, detail = '', cls = '', desc = '') =>
  `<button class="item ${cls}" data-act="${act}"><span class="lbl"><span>${label}</span>${desc ? `<span class="desc">${desc}</span>` : ''}</span><span class="detail">${detail}</span></button>`;

/* ================= home ================= */
function renderHome() {
  const el = $('#home');
  const list = [...decks].sort((a, b) => b.createdAt - a.createdAt);
  const total = cards.length, due = cards.filter(c => c.review).length;
  const tiles = list.map(d => {
    const cs = deckCards(d.id), n = cs.length, dd = dueCount(d.id);
    const cover = cs[0];
    return `<div class="tile">
      <button class="tile-open" data-open="${d.id}" aria-label="Study ${esc(d.name)}">
        <div class="cover">${cover ? `<img alt="" data-blob="${cover.thumbId}">` : ''}</div>
        <div><div class="tile-name">${esc(d.name)}</div>
        <div class="tile-meta">${plural(n, 'card')}${dd ? ` · <span class="due">${dd} to review</span>` : ''}</div></div>
      </button>
      <button class="more" data-menu="${d.id}" aria-label="Options for ${esc(d.name)}">${ICON.more}</button>
    </div>`;
  }).join('');
  el.innerHTML = `
    <div class="bar"><span class="brand">Subtext</span>
      <span class="tools"><button class="iconbtn" id="searchBtn" aria-label="Search words">${ICON.search}</button><button class="iconbtn" id="appMenu" aria-label="Backup and import">${ICON.more}</button></span></div>
    <h1>Your decks</h1>
    <p class="summary">${list.length ? `${plural(list.length, 'deck')} · ${plural(total, 'card')}${due ? ` · <span class="due">${due} to review</span>` : ''}` : 'Make a deck for each film or show you watch.'}</p>
    <div class="grid">${tiles}
      <div class="tile new"><button class="tile-open" data-new="1"><div class="cover">${ICON.plus}</div><div class="tile-name">New deck</div></button></div>
    </div>`;
  $$('img[data-blob]', el).forEach(img => {
    thumbIds.add(img.dataset.blob);
    blobURL(img.dataset.blob).then(u => { if (!u) return; img.onload = () => img.classList.add('in'); img.src = u; });
  });
}
$('#home').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const deck = id => decks.find(d => d.id === id);
  if (t.dataset.open) { const d = deck(t.dataset.open); deckCards(d.id).length ? openStudy(d) : addFlow(d); }
  else if (t.dataset.menu) deckMenu(deck(t.dataset.menu));
  else if (t.dataset.new) nameSheet(null);
  else if (t.id === 'appMenu') appMenu();
  else if (t.id === 'searchBtn') openSearch();
});

/* ================= deck sheets ================= */
function deckMenu(d) {
  const n = deckCards(d.id).length, dd = dueCount(d.id);
  sheet(`<h2>${esc(d.name)}</h2>
    <p class="sub">${plural(n, 'card')}${dd ? ` · <span class="due">${dd} to review</span>` : ''}</p>
    <div class="list">
      ${n ? item('study', 'Study') : ''}
      ${item('add', 'Add cards')}
      ${n ? item('browse', 'Browse cards') : ''}
      ${item('order', 'Card order', SORTS[d.sort] + ICON.chev)}
      ${item('rename', 'Rename')}
      ${item('del', 'Delete deck', '', 'danger')}
    </div>`, {
    study: () => closeSheet(() => openStudy(d)),
    add: () => addFlow(d),
    browse: () => closeSheet(() => openCards(d)),
    order: () => orderSheet(d),
    rename: () => nameSheet(d),
    del: () => confirmDeleteDeck(d)

}
function orderSheet(d) {
  sheet(`<h2>Card order</h2><p class="sub">Cards you checked the meaning of always come first.</p>
    <div class="list">${Object.entries(SORTS).map(([k, v]) => item('pick', v, d.sort === k ? `<span class="tick">${ICON.check}</span>` : '').replace('data-act="pick"', `data-act="pick" data-k="${k}"`)).join('')}</div>`, {
    pick: b => { d.sort = b.dataset.k; saveDeck(d); deckMenu(d); }
  });
}
function nameSheet(d, then) {
  sheet(`<h2>${d ? 'Rename deck' : 'New deck'}</h2>
    <form><div class="field"><input id="deckName" type="text" maxlength="80" autocomplete="off" enterkeyhint="done"
      placeholder="Film or show, e.g. Oppenheimer" value="${d ? esc(d.name) : ''}" aria-label="Deck name"></div>
    <div class="btns"><button type="submit" class="btn primary">${d ? 'Save' : 'Create deck'}</button></div></form>`, {

function confirmDeleteDeck(d) {
  const n = deckCards(d.id).length;
  sheet(`<h2>Delete “${esc(d.name)}”?</h2>
    <p class="note">${n ? `Its ${plural(n, 'card')} and their screenshots will be removed from Subtext. ` : ''}This can’t be undone.</p>
    <div class="btns"><button class="btn" data-act="cancel">Keep it</button><button class="btn danger" data-act="yes">Delete</button></div>`, {
    cancel: () => deckMenu(d),
    yes: async () => {
      await deleteCards(deckCards(d.id));
      decks = decks.filter(x => x.id !== d.id);
      await store.del('decks', [d.id]).catch(storageFail);
      renderHome(); closeSheet(); toast(`Deleted “${d.name}”`);

/* ================= adding cards ================= */
let pickCb = null;
$('#picker').addEventListener('change', e => { const f = [...e.target.files]; e.target.value = ''; if (pickCb && f.length) pickCb(f); });
function addFlow(d) {
  sheet(`<h2>Add cards</h2><p class="sub">to ${esc(d.name)}</p>
    <p class="note">Select this deck’s screenshots from your gallery. Subtext pairs them in the order you took them: each scene, then its definition.</p>
    <div class="btns"><button class="btn primary" data-act="pick">Choose screenshots</button></div>`, {
    pick: () => { pickCb = files => previewPairs(d, files); $('#picker').click(); }
  });
}
function previewPairs(d, files) {
  const sorted = files.sort((a, b) => (a.lastModified - b.lastModified) || a.name.localeCompare(b.name, undefined, { numeric: true }));
  const k = Math.floor(sorted.length / 2);
  if (!k) {
    sheet(`<h2>Pick at least two</h2><p class="note">Each card needs a scene and its definition.</p>
      <div class="btns"><button class="btn primary" data-act="again">Choose again</button></div>`,
      { again: () => { pickCb = f => previewPairs(d, f); $('#picker').click(); } });
    return;
  }
  const made = [];
  const u = f => { const x = URL.createObjectURL(f); made.push(x); return x; };
  const rows = [];
  for (let i = 0; i < k; i++) rows.push(`<div class="pair"><span class="n">${i + 1}</span>
    <img loading="lazy" alt="Scene ${i + 1}" src="${u(sorted[2 * i])}"><img class="pdef" loading="lazy" alt="Definition ${i + 1}" src="${u(sorted[2 * i + 1])}">
    <input class="wordin" data-i="${i}" type="text" placeholder="Word, for search" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Word for card ${i + 1}"></div>`);
  sheet(`<h2>${plural(k, 'new card')}</h2>
    <p class="sub">From ${plural(sorted.length, 'screenshot')} · scene on the left, definition on the right</p>
    ${sorted.length % 2 ? `<p class="warn">The last screenshot has no partner, so it will be left out.</p>` : ''}
    <div class="pairs">${rows.join('')}</div>
    <div class="btns"><button class="btn" data-act="again">Choose again</button><button class="btn primary" data-act="go">Add ${plural(k, 'card')}</button></div>`, {
    again: () => { pickCb = f => previewPairs(d, f); $('#picker').click(); },
    go: async () => {
      const words = $$('.wordin').map(x => x.value.trim());
      progressSheet('Adding cards', `0 of ${k}`);
      for (let i = 0; i < k; i++) {
        try { await addPair(d, sorted[2 * i], sorted[2 * i + 1], { word: words[i] || '' }); }
        catch (e) { storageFail(e); break; }
        progress(`${i + 1} of ${k}`, (i + 1) / k);
      }
      askPersist(); renderHome(); refreshCards();
      closeSheet(); toast(`Added ${plural(k, 'card')} to ${d.name}`);
    }
  });
  sheetCleanup = () => made.forEach(x => URL.revokeObjectURL(x));
}
function progressSheet(title, text) {
  sheet(`<h2>${title}</h2><p class="sub" id="progText">${text}</p><div class="meter"><i id="progBar"></i></div>`);
}
function progress(text, frac) {
  const t = $('#progText'), b = $('#progBar');
  if (t) t.textContent = text; if (b) b.style.width = Math.round(frac * 100) + '%';
}

/* ================= browse cards ================= */
let cardsView = null; // {deck, el, select:Set|null}
function openCards(d) {
  const el = document.createElement('div'); el.className = 'page';
  document.body.appendChild(el); document.body.classList.add('locked');
  cardsView = { deck: d, el, select: null };
  renderCards();
  el.addEventListener('click', onCardsClick);
  pushLayer(() => { el.remove(); cardsView = null; document.body.classList.remove('locked'); renderHome(); });
}
function refreshCards() { if (cardsView) renderCards(); }
function renderCards() {
  const { deck: d, el, select } = cardsView;
  const cs = deckCards(d.id);
  el.innerHTML = `<div class="home">
    <div class="bar"><button class="iconbtn" data-c="back" aria-label="Back">${ICON.back}</button>
      ${cs.length ? `<button class="textbtn" data-c="select">${select ? 'Done' : 'Select'}</button>` : ''}</div>
    <h1>${esc(d.name)}</h1>
    <p class="summary">${plural(cs.length, 'card')}${dueCount(d.id) ? ` · <span class="due">${dueCount(d.id)} to review</span>` : ''}</p>
    <div class="thumbs">${cs.map(c => `<button class="thumb${select && select.has(c.id) ? ' on' : ''}" data-id="${c.id}">
      <div class="pic"><img alt="" data-blob="${c.thumbId}">${c.review ? '<span class="dot"></span>' : ''}
      <div class="sel"><span>${ICON.check}</span></div></div>
      ${c.word ? `<span class="w">${esc(c.word)}</span>` : ''}</button>`).join('')}</div>
    ${cs.length ? '' : '<p class="empty">No cards left in this deck.</p>'}
  </div>
  ${select ? `<div class="selbar"><span class="count num">${select.size} selected</span>
    <button class="btn" data-c="move" ${select.size ? '' : 'disabled'}>Move</button>
    <button class="btn danger" data-c="delete" ${select.size ? '' : 'disabled'}>Delete</button></div>` : ''}`;
  $$('img[data-blob]', el).forEach(img => { thumbIds.add(img.dataset.blob); blobURL(img.dataset.blob).then(u => { if (u) img.src = u; }); });
}
function onCardsClick(e) {
  const t = e.target.closest('button'); if (!t || !cardsView) return;
  const v = cardsView;
  if (t.dataset.c === 'back') back();
  else if (t.dataset.c === 'select') { v.select = v.select ? null : new Set(); renderCards(); }
  else if (t.dataset.c === 'move') moveSheet(cards.filter(c => v.select.has(c.id)));
  else if (t.dataset.c === 'delete') confirmDeleteCards(cards.filter(c => v.select.has(c.id)));
  else if (t.dataset.id) {
    if (v.select) { v.select.has(t.dataset.id) ? v.select.delete(t.dataset.id) : v.select.add(t.dataset.id); renderCards(); }
    else cardSheet(cards.find(c => c.id === t.dataset.id));
  }
}
async function cardSheet(c) {
  sheet(`${c.word ? `<h2>${esc(c.word)}</h2>` : '<h2 class="muted">No word yet</h2>'}
    <div class="peek"><img id="pf" alt="Scene"><img id="pd" alt="Definition"></div>
    <div class="list">
      ${item('word', c.word ? 'Edit word' : 'Add word', '', '', c.word ? '' : 'So you can find it in search')}
      ${item('flag', c.review ? 'Clear review mark' : 'Mark for review', c.review ? '<span class="dot"></span>' : '')}
      ${item('move', 'Move to another deck')}
      ${item('del', 'Delete card', '', 'danger')}
    </div>`, {
    flag: () => { c.review = !c.review; c.streak = 0; saveCards([c]); renderCards(); cardSheet(c); },
    word: () => wordSheet(c),
    move: () => moveSheet([c]),
    del: () => confirmDeleteCards([c])
  });
  const [f, d] = await Promise.all([blobURL(c.frameId), blobURL(c.defId)]);
  const pf = $('#pf'), pd = $('#pd'); if (pf) pf.src = f; if (pd) pd.src = d;
}
function wordSheet(c) {
  sheet(`<h2>${c.word ? 'Edit word' : 'Add word'}</h2>
    <form><div class="field"><input id="wordName" type="text" maxlength="80" autocomplete="off" autocapitalize="none" spellcheck="false"
      enterkeyhint="done" value="${esc(c.word)}" placeholder="e.g. squaddie" aria-label="Word"></div>
    <div class="btns"><button type="submit" class="btn primary">Save</button></div></form>`, {
    submit: f => { c.word = $('#wordName', f).value.trim(); saveCards([c]); refreshCards(); cardSheet(c); }
  }, sh => setTimeout(() => { const i = $('#wordName', sh); if (i) i.focus(); }, 360));
}
function moveSheet(list) {
  const from = list[0] && list[0].deckId;
  const others = decks.filter(d => d.id !== from).sort((a, b) => a.name.localeCompare(b.name));
  sheet(`<h2>Move ${plural(list.length, 'card')}</h2><p class="sub">Choose a deck</p>
    <div class="list">${others.map(d => item('to', esc(d.name), `<span class="num">${deckCards(d.id).length}</span>`).replace('data-act="to"', `data-act="to" data-id="${d.id}"`)).join('')}
    ${item('fresh', 'New deck…')}</div>`, {
    to: b => doMove(list, decks.find(d => d.id === b.dataset.id)),
    fresh: () => nameSheet(null, nd => doMove(list, nd))
  });
}
function doMove(list, target) {
  let s = nextSeq(target.id);
  list.sort((a, b) => a.seq - b.seq).forEach(c => { c.deckId = target.id; c.seq = s++; });
  saveCards(list);
  if (cardsView) cardsView.select = null;
  refreshCards(); renderHome(); closeSheet(); toast(`Moved ${plural(list.length, 'card')} to ${target.name}`);
}
function confirmDeleteCards(list) {
  sheet(`<h2>Delete ${plural(list.length, 'card')}?</h2><p class="note">The screenshots are removed from Subtext only. Your gallery keeps its copies.</p>
    <div class="btns"><button class="btn" data-act="cancel">Cancel</button><button class="btn danger" data-act="yes">Delete</button></div>`, {
    cancel: () => closeSheet(),
    yes: async () => { await deleteCards(list); if (cardsView) cardsView.select = null; refreshCards(); renderHome(); closeSheet(); toast(`Deleted ${plural(list.length, 'card')}`); }
  });
}

/* ================= study ================= */
let S = null;
function buildOrder(list, sort) {
  let base = [...list].sort((a, b) => a.seq - b.seq);
  if (sort === 'newest') base.reverse();
  if (sort === 'shuffle') for (let i = base.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [base[i], base[j]] = [base[j], base[i]]; }
  return [...base.filter(c => c.review), ...base.filter(c => !c.review)];
}
function openStudy(d, startId) {
  const order = buildOrder(deckCards(d.id), d.sort);
  if (!order.length) { toast('This deck has no cards yet'); return; }
  const start = startId ? Math.max(0, order.findIndex(c => c.id === startId)) : 0;
  const el = document.createElement('div');
  el.className = 'study';
  el.innerHTML = `<div class="stage"></div>
    <div class="rail"><i></i></div>
    <div class="chrome"><button class="iconbtn" data-s="close" aria-label="Close deck">${ICON.close}</button>
      <div class="pos"><span class="tag" hidden><span class="dot"></span>Review</span><span class="count"></span></div></div>
    ${ls.get('hinted') ? '' : `<div class="hint"><span><b>↑</b> Swipe up for meaning</span><span><b>←</b> Next</span></div>`}`;
  document.body.appendChild(el); document.body.classList.add('locked');
  S = { deck: d, el, stage: $('.stage', el), order, i: 0, cur: null, def: false, peeked: new Set(), counted: new Set(), z: { s: 1, x: 0, y: 0 } };
  showSlide(start, 'none');
  el.addEventListener('pointerdown', onDown);
  el.addEventListener('pointermove', onMove);
  el.addEventListener('pointerup', onUp);
  el.addEventListener('pointercancel', onUp);
  el.addEventListener('click', e => { if (e.target.closest('[data-s="close"]')) back(); });
  pushLayer(closeStudy);
}
function closeStudy() {
  if (!S) return;
  const el = S.el; S = null; pts.clear(); g = null; pinch = null;
  el.style.transition = 'opacity .2s'; el.style.opacity = '0';
  setTimeout(() => { el.remove(); releaseFull(); }, 220);
  if (!searchView) document.body.classList.remove('locked');
  renderHome();
}
function makeSlide(c) {
  const s = document.createElement('div'); s.className = 'slide';
  s.innerHTML = `<div class="frame"><img alt="Scene"></div>
    <div class="def"><div class="dwrap"><div class="dimg"><img alt="Definition"></div>
      <div class="back">Swipe down for the scene · left for the next card</div></div></div>`;
  blobURL(c.frameId).then(u => { $('.frame img', s).src = u; });
  blobURL(c.defId).then(u => { $('.def img', s).src = u; });
  return s;
}
function preload(c) {
  if (!c) return;
  [c.frameId, c.defId].forEach(id => blobURL(id).then(u => { if (u) { const im = new Image(); im.src = u; } }));
}
function showSlide(i, dir) {
  const old = S.cur;
  const c = S.order[i];
  S.i = i; S.def = false; S.z = { s: 1, x: 0, y: 0 };
  const s = makeSlide(c);
  if (dir !== 'none') {
    s.style.transition = 'none';
    s.style.transform = `translateX(${dir === 'next' ? 34 : -34}%)`; s.style.opacity = '0';
  }
  S.stage.appendChild(s); S.cur = s;
  if (dir !== 'none') { s.getBoundingClientRect(); s.style.transition = ''; s.style.transform = ''; s.style.opacity = ''; }
  if (old) {
    old.style.transition = '';
    old.style.transform = `translateX(${dir === 'next' ? -34 : 34}%)`; old.style.opacity = '0';
    setTimeout(() => old.remove(), 340);
  }
  $('.count', S.el).textContent = `${i + 1} / ${S.order.length}`;
  $('.tag', S.el).hidden = !c.review;
  $('.rail i', S.el).style.width = ((i + 1) / S.order.length * 100) + '%';
  preload(S.order[i + 1]);
}
function dismissHint() {
  const h = S && $('.hint', S.el);
  if (h) { h.classList.add('gone'); setTimeout(() => h.remove(), 420); ls.set('hinted', '1'); }
}
function showDef() {
  if (!S || !S.cur) return;
  if (zoomed()) resetZ(true);
  const d = $('.def', S.cur); stopFling(); d.scrollTop = 0; d.style.transition = ''; d.style.transform = 'translateY(0)';
  S.def = true; dismissHint();
  const c = S.order[S.i];
  if (!S.peeked.has(c.id)) {
    S.peeked.add(c.id);
    c.review = true; c.streak = 0; c.peeks = (c.peeks || 0) + 1; c.lastSeen = Date.now();
    saveCards([c]);
    $('.tag', S.el).hidden = false;
  }
}
function hideDef() {
  if (!S || !S.cur) return;
  const d = $('.def', S.cur); d.style.transition = ''; d.style.transform = '';
  S.def = false;
}
function countCurrent() {
  const c = S.order[S.i];
  if (S.counted.has(c.id)) return;
  S.counted.add(c.id);
  c.seen = (c.seen || 0) + 1; c.lastSeen = Date.now();
  if (!S.peeked.has(c.id) && c.review) { c.streak = (c.streak || 0) + 1; if (c.streak >= 2) { c.review = false; c.streak = 0; } }
  saveCards([c]);
}
function next() {
  if (!S || !S.cur) return;
  countCurrent(); dismissHint();
  if (S.i + 1 < S.order.length) showSlide(S.i + 1, 'next');
  else bounce();
}
function prev() { if (S && S.cur && S.i > 0) showSlide(S.i - 1, 'prev'); else bounce(); }
function bounce() { snapBack(); try { navigator.vibrate && navigator.vibrate(12); } catch {} }
function snapBack() {
  if (!S || !S.cur) return;
  S.cur.style.transition = 'transform .45s cubic-bezier(.3,1.5,.5,1), opacity .3s'; S.cur.style.transform = ''; S.cur.style.opacity = '';
  const d = $('.def', S.cur); d.style.transition = ''; d.style.transform = S.def ? 'translateY(0)' : '';
}

/* zoom (scenes only) */
const zoomed = () => !!S && S.z.s > 1.01;
const zimg = () => S && S.cur && $('.frame img', S.cur);
function clampZ(z) {
  const img = zimg(); const W = S.el.clientWidth, H = S.el.clientHeight;
  const w = (img && img.naturalWidth) || W, h = (img && img.naturalHeight) || H, f = Math.min(W / w, H / h);
  const mx = Math.max(0, (w * f * z.s - W) / 2), my = Math.max(0, (h * f * z.s - H) / 2);
  z.x = Math.min(mx, Math.max(-mx, z.x)); z.y = Math.min(my, Math.max(-my, z.y));
  return z;
}
function applyZ(anim) {
  const img = zimg(); if (!img) return;
  img.style.transition = anim ? 'transform .3s var(--ease)' : 'none';

}
addEventListener('keydown', e => {
  if (!S || sheetOpen) return;
  const k = e.key;
  if (k === 'ArrowRight' || k === ' ') { e.preventDefault(); next(); }
  else if (k === 'ArrowLeft') { e.preventDefault(); prev(); }
  else if (k === 'ArrowUp') { e.preventDefault(); showDef(); }
  else if (k === 'ArrowDown') { e.preventDefault(); hideDef(); }

});

/* ================= search ================= */
let searchView = null;
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
function findWords(q) {
  const n = norm(q); if (!n) return [];
  const out = [];
  for (const c of cards) {
    if (!c.word) continue;
    const w = norm(c.word), i = w.indexOf(n);
    if (i < 0) continue;
    out.push({ c, i, w, rank: i === 0 ? 0 : (/[\s\-']/.test(w[i - 1]) ? 1 : 2) });
  }
  return out.sort((a, b) => a.rank - b.rank || a.w.localeCompare(b.w)).slice(0, 60);
}
function openSearch() {
  const el = document.createElement('div'); el.className = 'page search';
  el.innerHTML = `<div class="searchbar"><button class="iconbtn" data-q="back" aria-label="Back">${ICON.back}</button>
      <input id="q" type="search" placeholder="Search your words" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="search" aria-label="Search your words"></div>
    <div class="home"><div class="results" id="results"></div></div>`;
  document.body.appendChild(el); document.body.classList.add('locked');
  searchView = { el };
  const input = $('#q', el);
  input.addEventListener('input', () => renderResults(input.value));
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { const f = $('.res', el); if (f) f.click(); } });
  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.q === 'back') back();
    else if (b.dataset.card) { const c = cards.find(x => x.id === b.dataset.card); if (c) { input.blur(); openStudy(decks.find(d => d.id === c.deckId), c.id); } }
  });
  pushLayer(() => { el.remove(); searchView = null; if (!S) document.body.classList.remove('locked'); });
  renderResults('');
  input.focus();
}
function renderResults(q) {
  const box = $('#results'); if (!box) return;
  const named = cards.filter(c => c.word).length, unnamed = cards.length - named;
  if (!norm(q)) {
    box.innerHTML = `<p class="note">${plural(named, 'word')} saved.${unnamed ? ` ${plural(unnamed, 'card')} ${unnamed === 1 ? 'has' : 'have'} no word yet, so search can’t find ${unnamed === 1 ? 'it' : 'them'}. Add words from a deck’s Browse cards.` : ''}</p>`;
    return;
  }
  const hits = findWords(q);
  if (!hits.length) { box.innerHTML = `<p class="note">No saved word matches “${esc(q.trim())}”.</p>`; return; }
  const n = norm(q).length;
  box.innerHTML = hits.map(({ c, i }) => {
    const w = c.word, d = decks.find(x => x.id === c.deckId);
    return `<button class="res" data-card="${c.id}"><img alt="" data-blob="${c.thumbId}">
      <span><span class="rw">${esc(w.slice(0, i))}<mark>${esc(w.slice(i, i + n))}</mark>${esc(w.slice(i + n))}</span>
      <span class="rd">${esc(d ? d.name : '')}${c.review ? ' · <span class="due">review</span>' : ''}</span></span></button>`;
  }).join('');
  $$('img[data-blob]', box).forEach(img => { thumbIds.add(img.dataset.blob); blobURL(img.dataset.blob).then(u => { if (u) img.src = u; }); });
}

/* ================= backup & import ================= */
function loadZip() {
  if (window.JSZip) return Promise.resolve(window.JSZip);
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    s.onload = () => res(window.JSZip);
    s.onerror = () => rej(new Error('offline'));
    document.head.appendChild(s);
  });
}
const EXT = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/gif': 'gif', 'image/heic': 'heic' };
const MIME = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', gif: 'image/gif', heic: 'image/heic' };
async function appMenu() {
  let used = '';
  try { const e = await navigator.storage.estimate(); used = `${Math.max(1, Math.round(e.usage / 1048576))} MB stored on this phone`; } catch {}
  sheet(`<h2>Backup</h2><p class="sub num">${used || plural(cards.length, 'card')}</p>
    <div class="list">
      ${item('export', 'Back up everything', '', '', 'Saves one .zip with all decks, screenshots and review marks')}
      ${item('import', 'Import a backup', '', '', 'Adds decks and cards from a Subtext .zip')}
    </div>`, {
    export: exportAll,
    import: () => $('#zipPicker').click()
  });
}
async function exportAll() {
  if (!cards.length) { toast('Nothing to back up yet'); return; }
  progressSheet('Preparing backup', 'Loading…');
  let JSZip; try { JSZip = await loadZip(); } catch { closeSheet(); toast('Backup needs an internet connection the first time'); return; }
  const zip = new JSZip(), man = { app: 'subtext', version: 1, exportedAt: new Date().toISOString(), decks: [] };
  let done = 0;
  for (const d of decks) {
    const out = { id: d.id, name: d.name, sort: d.sort, createdAt: d.createdAt, cards: [] };
    for (const c of deckCards(d.id)) {
      const [f, df] = await Promise.all([store.get('blobs', c.frameId), store.get('blobs', c.defId)]);
      if (!f || !df) continue;
      const fp = `images/${c.id}-scene.${EXT[f.blob.type] || 'jpg'}`, dp = `images/${c.id}-definition.${EXT[df.blob.type] || 'jpg'}`;
      zip.file(fp, f.blob); zip.file(dp, df.blob);
      out.cards.push({ id: c.id, word: c.word, seq: c.seq, scene: fp, definition: dp, review: c.review, streak: c.streak, peeks: c.peeks, seen: c.seen, lastSeen: c.lastSeen, addedAt: c.addedAt });
      progress(`${++done} of ${cards.length} cards`, done / cards.length * 0.6);
    }
    man.decks.push(out);
  }
  zip.file('manifest.json', JSON.stringify(man, null, 2));
  const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' }, m => progress('Packing…', 0.6 + m.percent / 250));
  const name = `subtext-backup-${new Date().toISOString().slice(0, 10)}.zip`;
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  closeSheet(); toast(`Saved ${name}`);
}
$('#zipPicker').addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = ''; if (!files.length) return;
  progressSheet('Importing', 'Reading the file…');
  let added = 0, skipped = 0; const touched = new Set();
  try {
    const JSZip = await loadZip();
    for (let fi = 0; fi < files.length; fi++) {
      const label = files.length > 1 ? `File ${fi + 1} of ${files.length} · ` : '';
      progress(`${label}Reading…`, 0);
      const zip = await JSZip.loadAsync(files[fi]);
      const mf = zip.file('manifest.json');
      if (!mf) throw new Error(`This .zip isn’t a Subtext backup: ${files[fi].name}`);
      const man = JSON.parse(await mf.async('string'));
      const total = (man.decks || []).reduce((n, d) => n + (d.cards || []).length, 0) || 1;
      let n = 0;
      for (const md of man.decks || []) {
        let d = decks.find(x => md.id && x.id === md.id) || decks.find(x => x.name.toLowerCase() === String(md.name || '').trim().toLowerCase());
        if (!d) {
          d = { id: md.id && !decks.some(x => x.id === md.id) ? md.id : uid(), name: String(md.name || 'Imported').trim(), sort: SORTS[md.sort] ? md.sort : 'added', createdAt: md.createdAt || Date.now() };
          decks.push(d); await store.put('decks', [d]);
        }
        const list = [...(md.cards || [])].sort((a, b) => (a.seq ?? 0) - (b.seq ?? 0));
        for (const mc of list) {
          n++;
          progress(`${label}${n} of ${total}`, n / total);
          if (mc.id && cards.some(c => c.id === mc.id)) { skipped++; continue; }
          const sp = mc.scene || mc.frame, dp = mc.definition;
          const sf = sp && zip.file(sp), df = dp && zip.file(dp);
          if (!sf || !df) { skipped++; continue; }
          const type = p => MIME[p.split('.').pop().toLowerCase()] || 'image/jpeg';
          const scene = new Blob([await sf.async('arraybuffer')], { type: type(sp) });
          const def = new Blob([await df.async('arraybuffer')], { type: type(dp) });
          const extra = { word: mc.word || '', review: !!mc.review, streak: mc.streak || 0, peeks: mc.peeks || 0, seen: mc.seen || 0, lastSeen: mc.lastSeen || 0, addedAt: mc.addedAt || Date.now() };
          if (mc.id) extra.id = mc.id;
          await addPair(d, scene, def, extra);
          added++; touched.add(d.id);
        }
      }
    }
    askPersist(); renderHome(); closeSheet();
    toast(`Imported ${plural(added, 'card')}${touched.size ? ` into ${plural(touched.size, 'deck')}` : ''}${skipped ? ` · ${skipped} already here or incomplete` : ''}`);
  } catch (err) {
    console.error(err);
    askPersist(); renderHome(); closeSheet();
    const msg = err.message === 'offline' ? 'Import needs an internet connection the first time' : (err.message.startsWith('This') ? err.message : 'Couldn’t read that backup file');
    toast(added ? `Imported ${plural(added, 'card')}, then stopped: ${msg}` : msg);
  }
});

/* ================= start ================= */
async function seed() {
  const m = await store.get('meta', 'seeded').catch(() => null);
  if (m) return;
  await store.put('meta', [{ k: 'seeded', v: 1 }]).catch(() => {});
  try {
    const get = u => fetch(u).then(r => { if (!r.ok) throw new Error(u); return r.blob(); });
    const [f, d] = await Promise.all([get('sample/frame.jpg'), get('sample/definition.jpg')]);
    const deck = newDeck('Slow Horses');
    await addPair(deck, f, d, { word: 'squaddie' });
  } catch (e) { console.warn('sample skipped', e); }
}
(async () => {
  try { store = idbStore(await openDB()); } catch (e) { console.warn('IndexedDB unavailable, using memory', e); }
  try { decks = await store.all('decks'); cards = await store.all('cards'); } catch { decks = []; cards = []; }
  renderHome();
  if (!decks.length) { await seed(); renderHome(); }
  if ('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
})();
